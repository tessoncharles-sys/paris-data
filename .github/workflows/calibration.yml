name: Recalibration mensuelle

on:
  schedule:
    - cron: "17 3 1 * *"   # le 1er de chaque mois vers 4h-5h (heure de Paris)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recalibrer le foot (test sur les 10 derniers mois)
        run: python scripts/calibrate.py
      - name: Recalibrer le tennis (test sur les 21 derniers mois)
        run: python scripts/tennis_calibrate.py
      - name: Écrire le bilan
        run: python scripts/report.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "paris-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Recalibration du $(date +%F)"
          git pull --rebase -q origin main && git push
