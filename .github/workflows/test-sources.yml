name: Historique tennis (complet)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python scripts/tennis_collect.py --full
      - run: |
          git config user.name "paris-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/tennis
          git diff --cached --quiet || git commit -m "Historique tennis complet"
          git pull --rebase -q origin main && git push
