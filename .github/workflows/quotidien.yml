name: Collecte et analyse quotidiennes

on:
  schedule:
    - cron: "17 5 * * *"   # chaque jour vers 6h-7h (heure de Paris)
  workflow_dispatch: {}     # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecter les données
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/collect.py

      - name: Calculer les probabilités (foot)
        run: python scripts/model.py

      - name: Collecter le tennis
        continue-on-error: true
        run: python scripts/tennis_collect.py

      - name: Calculer les probabilités (tennis)
        continue-on-error: true
        run: python scripts/tennis.py

      - name: Handball (matchs, cotes, cotes justes)
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/handball.py

      - name: Assembler le fichier du tableau de bord
        run: python scripts/merge.py

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "paris-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Données du $(date +%F)"
          git push
