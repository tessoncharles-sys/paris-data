name: Collecte et analyse quotidiennes

on:
  schedule:
    # 3 passages par jour, avant les vérifications Claude de 6h, 12h et 18h.
    # GitHub lance parfois ses tâches planifiées avec des heures de retard : chaque passage
    # a donc deux créneaux (heures UTC) ; le second ne refait rien si le premier a tourné.
    - cron: "47 1 * * *"
    - cron: "23 3 * * *"
    - cron: "47 7 * * *"
    - cron: "23 9 * * *"
    - cron: "47 13 * * *"
    - cron: "23 15 * * *"
  workflow_dispatch: {}     # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: quotidien
  cancel-in-progress: false

jobs:
  garde:
    # passe son tour si un passage a déjà eu lieu il y a moins de 2 h (créneau de secours)
    runs-on: ubuntu-latest
    outputs:
      passer: ${{ steps.age.outputs.passer }}
    steps:
      - uses: actions/checkout@v4
      - id: age
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt, os
          try:
              t = dt.datetime.fromisoformat(json.load(open("data/maj.json"))["genere_le"].replace("Z", "+00:00"))
              age = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 3600
          except Exception:
              age = 99
          manuel = os.environ.get("EVT") == "workflow_dispatch"
          print("passer=" + ("oui" if age < 2 and not manuel else "non"))
          PY
        env:
          EVT: ${{ github.event_name }}

  run:
    needs: garde
    if: needs.garde.outputs.passer != 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          mkdir -p data/logs && date -u +"Passage du %F %H:%M UTC" > data/logs/dernier_passage.txt

      - name: Collecter les données
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: set -o pipefail; python scripts/collect.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Cotes foot des bookmakers (Pinnacle et autres)
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: set -o pipefail; python scripts/odds_foot.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Cotes Winamax et opérateurs français (une fois par jour, au premier passage)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCER: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: set -o pipefail; python scripts/odds_winamax.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Calculer les probabilités (foot)
        run: set -o pipefail; python scripts/model.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Collecter le tennis
        continue-on-error: true
        run: set -o pipefail; python scripts/tennis_collect.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Calculer les probabilités (tennis)
        continue-on-error: true
        run: set -o pipefail; python scripts/tennis.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Handball (matchs, cotes, cotes justes)
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: set -o pipefail; python scripts/handball.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Basket (matchs, cotes, cotes justes)
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: set -o pipefail; python scripts/basket.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Assembler le fichier du tableau de bord
        run: set -o pipefail; python scripts/merge.py 2>&1 | tee -a data/logs/dernier_passage.txt

      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "paris-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Données du $(date +%F) $(date +%H)h UTC"
          git pull --rebase -q origin main && git push
